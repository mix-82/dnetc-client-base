name: macOS arm64 Vulkan CI

on:
  push:
    branches: [ "ci-vulkan-client" ]

jobs:
  build:
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-26 ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install the Vulkan loader, headers and MoltenVK
      run: brew install vulkan-loader vulkan-headers molten-vk
    - name: configure
      env:
        SHELL: /bin/sh
      run: VULKAN_SDK="$(brew --prefix)" ./configure macosx-arm64-vulkan
    - name: make
      run: make
    # The runner is a virtual machine. Its "Apple Paravirtual device" is a
    # Metal GPU, so MoltenVK and the plain client work on it.
    - name: gpuinfo
      run: ./dnetc -gpuinfo
    # -test exits 0 even when it tested nothing, so look for the pass line.
    - name: test
      run: |
        ./dnetc -test | tee test.log
        grep -q "32/32 Tests Passed" test.log
