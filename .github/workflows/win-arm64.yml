name: Windows ARM64 client

# Builds the Windows ARM64 client (makefile.vc, PROCESSOR_ARCHITECTURE=ARM64:
# MSVC + LLVM clang for the arm64 cores) natively on windows-11-arm and as a
# cross build on windows-latest (x64), and runs -cpuinfo, -test, -stress,
# -bench and a short offline crunch on the ARM runner. Regression: the x64
# and 32-bit x86 clients are built before (dcti master) and after the change
# and their warnings compared; those clients are also benchmarked under
# emulation on the ARM runner (what Windows on ARM users run today). Linux
# and macOS arm64 builds run -test. Informational: the native client is
# also packed with UPX 5.3.0 (not done by the build) and tested again. No
# work units are fetched or returned.
on:
  push:
    branches: [win-arm64-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build + tests (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: Probe
      shell: pwsh
      run: |
        "--- OS / CPU"
        [System.Environment]::OSVersion.VersionString
        "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
        "PROCESSOR_IDENTIFIER=$env:PROCESSOR_IDENTIFIER"
        Get-CimInstance Win32_Processor | Format-List Name,Manufacturer,Description,Caption,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed,ProcessorId,Architecture,Level,Revision
        "--- registry CentralProcessor\0"
        reg query "HKLM\HARDWARE\DESCRIPTION\System\CentralProcessor\0"
        "--- Visual Studio"
        & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format text | Select-String "installationPath|installationVersion|displayName"
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        Get-ChildItem "$vs\VC\Tools\Llvm" -ErrorAction SilentlyContinue | Select-Object Name
        "--- tools on PATH"
        Get-Command bash, git, clang, clang-cl, timeout -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize
    - name: Build
      shell: cmd
      run: tools\win-arm64-ci\build.cmd arm64 ARM64 ci-out
    - name: Test
      if: always()
      shell: bash
      run: bash tools/win-arm64-ci/run.sh ./dnetc.exe ci-out windows-11-arm full
    - name: Stack-growth test (MIX cores, with control)
      if: always()
      shell: cmd
      run: tools\win-arm64-ci\stackprobe.cmd
    - name: Extra tests (stress on all cores, auto core selection, disk buffers, console stub)
      if: always()
      shell: bash
      run: bash tools/win-arm64-ci/extra.sh . ci-out/extra all
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native
        path: |
          ci-out/
          dnetc.exe
          dnetc.com
          dnetc.scr
          dnetc.map
        if-no-files-found: warn

  cross:
    name: cross build (x64 host)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Build
      shell: cmd
      run: tools\win-arm64-ci\build.cmd amd64_arm64 ARM64 ci-out
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross
        path: |
          ci-out/
          dnetc.exe
        if-no-files-found: warn

  cross-test:
    name: cross-built client on windows-11-arm
    needs: cross
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: cross
        path: cross
    - name: Test
      shell: bash
      run: bash tools/win-arm64-ci/run.sh ./cross/dnetc.exe ci-out cross quick
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-test
        path: ci-out/

  packed:
    name: UPX-packed client, informational (windows-11-arm)
    needs: native
    runs-on: windows-11-arm
    timeout-minutes: 40
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: native
        path: native
    - name: Get UPX 5.3.0 (x64 build, runs under emulation)
      shell: pwsh
      run: |
        $v = "5.3.0"
        $zip = "$env:RUNNER_TEMP\upx.zip"
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v$v/upx-$v-win64.zip" -OutFile $zip
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
        if ($hash -ne "d127996c76615e431be810e9c8d2910dbe3dd400600c5c0c50276fc5a17a9705") { throw "upx.zip sha256 mismatch: $hash" }
        Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
        Get-ChildItem "$env:RUNNER_TEMP\upx-$v-win64" | Select-Object Name, Length
    - name: Pack and test
      shell: bash
      run: bash tools/win-arm64-ci/upxtest.sh native/dnetc.exe "$RUNNER_TEMP/upx-5.3.0-win64/upx.exe" ci-out/upx
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: packed
        path: ci-out/

  x64-x86:
    name: ${{ matrix.makearch }} build before/after (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - vcarch: x64
            makearch: AMD64
            name: amd64
          - vcarch: x86
            makearch: x86
            name: x86
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install NASM, YASM and ISPC
      shell: pwsh
      run: |
        choco install nasm yasm -y --no-progress
        "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if ("${{ matrix.name }}" -eq "amd64") {
          $v = "1.32.0"
          $zip = "$env:RUNNER_TEMP\ispc.zip"
          Invoke-WebRequest -Uri "https://github.com/ispc/ispc/releases/download/v$v/ispc-v$v-windows.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "148d5cd96abe7501c730d5fbd00f1f0c893b96bfeada38d1811c9b6251e86a5c") { throw "ispc.zip sha256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ispc-v$v-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
    - name: Check out the base commit (dcti master before the change)
      shell: bash
      run: |
        git fetch --no-tags -q https://github.com/dcti/dnetc-client-base master
        base=$(git merge-base HEAD FETCH_HEAD)
        echo "base commit: $(git log -1 --format='%h %s' $base)"
        git worktree add -q ../before $base
    - name: Build after
      shell: cmd
      run: tools\win-arm64-ci\build.cmd ${{ matrix.vcarch }} ${{ matrix.makearch }} ci-out
    - name: Build before
      if: always()
      shell: cmd
      run: |
        cd ..\before
        %GITHUB_WORKSPACE%\tools\win-arm64-ci\build.cmd ${{ matrix.vcarch }} ${{ matrix.makearch }} %GITHUB_WORKSPACE%\ci-out\before
    - name: Compare warnings
      if: always()
      shell: bash
      run: bash tools/win-arm64-ci/compare-warnings.sh ci-out/before/build.log ci-out/build.log | tee ci-out/compare-warnings.txt
    - name: Test (native x64 host)
      shell: bash
      run: bash tools/win-arm64-ci/run.sh ./dnetc.exe ci-out/native windows-latest-${{ matrix.name }} quick any
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-${{ matrix.name }}
        path: |
          ci-out/
          dnetc.exe
        if-no-files-found: warn

  emulated:
    name: x64 and x86 clients under emulation (windows-11-arm)
    needs: x64-x86
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-amd64
        path: emu-amd64
    - uses: actions/download-artifact@v4
      with:
        name: build-x86
        path: emu-x86
    - name: x64 client under emulation
      if: always()
      shell: bash
      run: bash tools/win-arm64-ci/run.sh ./emu-amd64/dnetc.exe ci-out/amd64 emulated-amd64 bench any
    - name: x86 client under emulation
      if: always()
      shell: bash
      run: bash tools/win-arm64-ci/run.sh ./emu-x86/dnetc.exe ci-out/x86 emulated-x86 bench any
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: emulated
        path: ci-out/

  unix:
    name: ${{ matrix.os }} build + -test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    steps:
    - uses: actions/checkout@v4
    - name: Build and test
      run: |
        case "$RUNNER_OS" in Linux) t=linux-arm64 ;; macOS) t=macosx-arm64 ;; esac
        ./configure $t > cfg.log 2>&1 || { tail -20 cfg.log; exit 1; }
        make -j3 > build.log 2>&1 || [ -x dnetc ] || { grep -iE -m20 error build.log; exit 1; }
        ./dnetc -test rc5-72 < /dev/null > test.log 2>&1
        n=$(grep -c 'using core #' test.log); p=$(grep -c '32/32 Tests Passed' test.log)
        echo "-test: $p of $n cores pass 32/32"
        [ "$n" = 8 ] && [ "$p" = 8 ]

  upx-build:
    name: build with UPX set (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Get UPX 5.3.0 and 5.0.2 (x64 builds, run under emulation)
      shell: pwsh
      run: |
        $want = @{ "5.3.0" = "d127996c76615e431be810e9c8d2910dbe3dd400600c5c0c50276fc5a17a9705"; "5.0.2" = "1cff6d6ee01c404d4a1ae56003056bd4cfa28d0a5cea1d0950daaf872a4facc9" }
        foreach ($v in $want.Keys) {
          $zip = "$env:RUNNER_TEMP\upx-$v.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v$v/upx-$v-win64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $want[$v]) { throw "upx $v sha256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
        }
    - name: Version gate checks
      shell: cmd
      run: tools\win-arm64-ci\upxcheck.cmd %RUNNER_TEMP%\upx-5.3.0-win64 %RUNNER_TEMP%\upx-5.0.2-win64 ci-out
    - name: Build with UPX 5.3.0
      shell: cmd
      run: |
        rem upx.exe reads an environment variable UPX as its own options, and
        rem nmake exports command-line macros to the environment, so UPX is
        rem defined inside a wrapper makefile (makefile macros are not exported).
        set UPXDIR=%RUNNER_TEMP%\upx-5.3.0-win64
        echo UPX=%UPXDIR%> upxwrap.mak
        echo !include makefile.vc>> upxwrap.mak
        set MAKEFILE=upxwrap.mak
        call tools\win-arm64-ci\build.cmd arm64 ARM64 ci-out
        if errorlevel 1 exit /b 1
        echo --- packed?
        "%UPXDIR%\upx.exe" -t dnetc.exe dnetc.scr || exit /b 1
        "%UPXDIR%\upx.exe" --fileinfo dnetc.exe dnetc.scr
        dir dnetc.exe dnetc.scr dnetc.com | findstr dnetc
    - name: Test the client as built (packed)
      shell: bash
      run: bash tools/win-arm64-ci/run.sh ./dnetc.exe ci-out upx-built full
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: upx-build
        path: |
          ci-out/
          dnetc.exe
          dnetc.scr
        if-no-files-found: warn
