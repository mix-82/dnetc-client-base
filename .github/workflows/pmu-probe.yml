name: PMU probe (arm64 runner performance counters)

on:
  push:
    branches: [ndk-probe]
    paths:               # only when this probe changes; otherwise use "Re-run all jobs" on an earlier run
      - '.github/workflows/pmu-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pmu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
    - name: Probe
      run: |
        set +e
        {
        echo "## PMU probe: $(uname -r), $(grep -m1 'CPU part' /proc/cpuinfo)"
        echo '```'
        echo "--- event sources:"; ls /sys/bus/event_source/devices/
        echo "--- armv8 PMU dirs:"; ls -d /sys/bus/event_source/devices/armv8* /sys/devices/armv8* 2>&1
        echo "--- dmesg PMU lines:"; sudo dmesg | grep -iE 'pmu|perf' | head
        echo "--- perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid)"
        sudo apt-get -qq update >/dev/null; sudo apt-get -qq install -y linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get -qq install -y linux-tools-azure >/dev/null 2>&1
        P=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); echo "--- perf binary: ${P:-none}"
        [ -n "$P" ] || P=perf
        echo "--- perf list (hw/raw):"; sudo $P list hw 2>&1 | head -15
        echo "--- perf stat on a compute loop:"
        sudo $P stat -e cycles,instructions,stall_frontend,stall_backend,inst_spec,ase_spec -- sh -c 'i=0; while [ $i -lt 300000 ]; do i=$((i+1)); done' 2>&1 | tail -15
        echo '```'
        } | tee pmu.md
        cat pmu.md >> "$GITHUB_STEP_SUMMARY"
