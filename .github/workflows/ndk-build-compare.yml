name: NDK full build compare (cputypes fix)

on:
  push:
    branches: [ndk-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ndk: [r22, r30]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch refs
      run: |
        git remote add upstream https://github.com/dcti/dnetc-client-base
        git fetch -q upstream master
        git fetch -q origin android-detect
    - name: Fetch NDK r22
      if: matrix.ndk == 'r22'
      working-directory: /tmp
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r22-linux-x86_64.zip
        unzip -q android-ndk-r22-linux-x86_64.zip
        echo "NDK=/tmp/android-ndk-r22" >> $GITHUB_ENV
    - name: Build both
      run: |
        bash tools/ndk-probe/build-compare.sh
        cat cmp/summary.md >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ndk-build-compare-${{ matrix.ndk }}
        path: cmp
  run:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ndk: [r22, r30]
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: ndk-build-compare-${{ matrix.ndk }}
        path: cmp
    - name: Run the static Android binaries natively on arm64 Linux
      continue-on-error: true
      run: |
        cd cmp
        for v in raw orig fix; do
          [ -f dnetc-$v ] || { echo "$v: no binary" | tee -a run.md; continue; }
          chmod +x dnetc-$v
          echo "### ${{ matrix.ndk }} $v" >> run.md
          ./dnetc-$v -version 2>&1 | grep -m1 'client for' | sed 's/^/    /' >> run.md
          ./dnetc-$v -test rc5-72 2>&1 | grep -E 'Tests Passed|FAIL' | sed -E 's/^\[[^]]*\] /    /' >> run.md
        done
        cat run.md; cat run.md >> "$GITHUB_STEP_SUMMARY"
    - name: dnetc.log with -cpuinfo and -test (fixed build)
      continue-on-error: true
      run: |
        mkdir -p log && cp cmp/dnetc-fix log/dnetc && cd log
        { echo "\$ uname -a"; uname -a; echo "\$ ./dnetc -cpuinfo"; ./dnetc -l dnetc.log -cpuinfo; echo "\$ ./dnetc -test"; ./dnetc -l dnetc.log -test; } > console.txt 2>&1
        ls -la; wc -l dnetc.log console.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ndk-log-${{ matrix.ndk }}
        path: |
          log/dnetc.log
          log/console.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ndk-run-${{ matrix.ndk }}
        path: cmp/run.md
