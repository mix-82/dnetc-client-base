name: arm64 NEON cores

# Runs only when started by hand:
#   gh workflow run arm64-cores.yml --ref arm64-neon-cores
# or, for one job only (its key below, e.g. linux-arm64):
#   gh workflow run arm64-cores.yml --ref arm64-neon-cores -f only=linux-arm64
#
# Benchmarks every RC5-72 arm64 core (ANSI, KS-MONIKA, NEON 1x4/2x4/4x4/8x4)
# on two real ARM CPUs, to check the llvm-mca estimates against hardware:
#   - Linux on Arm Neoverse N2 (ubuntu-24.04-arm): gcc build (configure
#     linux-arm64, as shipped) and a clang -O3 build of the same tree
#   - macOS on Apple M1 (macos-15): configure macosx-arm64 (Apple clang)
# Each build runs -cpuinfo, -test and -stress, then -bench three times. No
# distributed.net work units are fetched or returned.

on:
  workflow_dispatch:
    inputs:
      only:
        description: run only this job (its key), empty for all
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: arm64-cores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    if: ${{ inputs.only == '' || inputs.only == 'linux-arm64' }}
    name: linux-arm64 (Neoverse N2, gcc and clang)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
    - uses: actions/checkout@v4
    - name: Install clang
      if: matrix.compiler == 'clang'
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q clang lld
    - name: Build
      run: |
        mkdir -p ci-out
        { SHELL=/bin/sh ./configure linux-arm64 && \
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            # same defines as configure, clang flags in place of the gcc ones
            defs=$(sed -n 's/^CCFLAGS = //p' Makefile | grep -oE -- '-D[A-Za-z0-9_=]+' | tr '\n' ' ')
            sed -i "s|^CC = .*|CC = clang++|; s|^AS = .*|AS = clang -c|; s|^CCFLAGS = .*|CCFLAGS = -O3 -march=armv8-a -Wno-register -fno-exceptions -fno-rtti $defs \${HPATHS}|" Makefile
          fi && \
          make -j"$(nproc)"; } 2>&1 | tee ci-out/build.log
        test -x dnetc
    - name: Test
      run: |
        { ./dnetc -cpuinfo
          ./dnetc -test rc5-72
          ./dnetc -stress rc5-72
          for run in 1 2 3; do echo "=== bench run $run"; ./dnetc -bench rc5-72; done
        } 2>&1 | tee ci-out/test-${{ matrix.compiler }}.log
        grep -E 'Tests Passed|Stress-test|keys/sec' ci-out/test-${{ matrix.compiler }}.log > ci-out/summary-${{ matrix.compiler }}.txt || true
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-${{ matrix.compiler }}
        path: ci-out/
        if-no-files-found: warn

  macos-arm64:
    if: ${{ inputs.only == '' || inputs.only == 'macos-arm64' }}
    name: macos-arm64 (Apple M1, clang)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        mkdir -p ci-out
        { SHELL=/bin/sh ./configure macosx-arm64 && make -j"$(sysctl -n hw.ncpu)"; } 2>&1 | tee ci-out/build.log
        test -x dnetc
    - name: Test
      run: |
        { ./dnetc -cpuinfo
          ./dnetc -test rc5-72
          ./dnetc -stress rc5-72
          for run in 1 2 3; do echo "=== bench run $run"; ./dnetc -bench rc5-72; done
        } 2>&1 | tee ci-out/test-macos.log
        grep -E 'Tests Passed|Stress-test|keys/sec' ci-out/test-macos.log > ci-out/summary-macos.txt || true
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        path: ci-out/
        if-no-files-found: warn
