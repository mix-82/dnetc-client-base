name: arm64 core benchmark

# Builds the arm64 client on GitHub-hosted arm64 runners and runs
# tools/ci-bench/ci-arm64-bench.sh: -test rc5-72, then several rounds of
# -bench rc5-72 to compare the RC5-72 cores (MIX NEON16 vs NEON 8x4,
# KS-MONIKA, ANSI). Runs on pushes to the neon-mix16 branch, or by hand:
#   gh workflow run arm64-bench.yml --ref neon-mix16
# No distributed.net work units are fetched or returned.

on:
  push:
    branches: [neon-mix16]
    paths:                 # only when the cores, their build or this benchmark change
      - 'rc5-72/arm64/**'
      - 'common/core_r72.cpp'
      - 'configure'
      - 'tools/ci-bench/ci-arm64-bench.sh'
      - '.github/workflows/arm64-bench.yml'
  workflow_dispatch:
    inputs:
      rounds:
        description: benchmark rounds per job
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: arm64-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: linux-arm64 slot ${{ matrix.slot }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        mkdir -p tools/ci-bench/ci-out
        { SHELL=/bin/sh ./configure linux-arm64 && make -j"$(nproc)"; } 2>&1 | tee tools/ci-bench/ci-out/build.log
        test -x dnetc
    - name: Test and benchmark
      env:
        BUILD: linux-arm64 (gcc, slot ${{ matrix.slot }})
        ROUNDS: ${{ inputs.rounds || '3' }}
      run: bash tools/ci-bench/ci-arm64-bench.sh
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-slot${{ matrix.slot }}
        path: tools/ci-bench/ci-out/
        if-no-files-found: warn

  macos-arm64:
    name: macos-arm64 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        mkdir -p tools/ci-bench/ci-out
        { SHELL=/bin/sh ./configure macosx-arm64 && make -j"$(sysctl -n hw.ncpu)"; } 2>&1 | tee tools/ci-bench/ci-out/build.log
        test -x dnetc
    - name: Test and benchmark
      env:
        BUILD: macosx-arm64 (clang, ${{ matrix.os }})
        ROUNDS: ${{ inputs.rounds || '3' }}
      run: bash tools/ci-bench/ci-arm64-bench.sh
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-${{ matrix.os }}
        path: tools/ci-bench/ci-out/
        if-no-files-found: warn
