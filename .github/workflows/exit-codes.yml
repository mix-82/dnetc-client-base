name: Exit code tests (EXPERIMENT, not for merge)

# Builds the client for several targets and runs tools/exit-codes/exitcodes.sh
# on each one. The script records the exit code of a fixed list of cases.
# Only -cpuinfo/-gpuinfo, -test, -benchmark2 and offline runs are used;
# nothing is fetched from or sent to distributed.net.

on:
  push:
    branches: [ "ci-exit-codes" ]

env:
  ISPC_VERSION: "1.32.0"

jobs:
  # ------------------------------------------------------------------ Linux
  linux:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            packages: yasm
            ispc: yes
            configure: ./configure linux-amd64
            make: make -j4
            info: -cpuinfo
            packet: 1
            broken: yes
          - label: linux-x86
            runner: ubuntu-latest
            packages: yasm nasm gcc-multilib g++-multilib
            configure: setarch i686 ./configure linux-x86
            make: make -j4 LDFLAGS=-m32
            info: -cpuinfo
            packet: 1
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            packages: file
            configure: ./configure linux-arm64
            make: make -j4
            info: -cpuinfo
            packet: 1
          - label: linux-amd64-opencl-no-device
            runner: ubuntu-latest
            packages: ocl-icd-opencl-dev pocl-opencl-icd
            configure: ./configure linux-amd64-opencl
            make: make -j4
            info: -gpuinfo
          - label: linux-amd64-opencl-pocl
            runner: ubuntu-latest
            packages: ocl-icd-opencl-dev pocl-opencl-icd
            configure: ./configure linux-amd64-opencl
            make: make -j4
            info: -gpuinfo
            shim: yes
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}
        # let the script put each client start in an empty network namespace
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        unshare -rn true && echo "network namespaces available"
    - name: Install ispc
      if: matrix.ispc == 'yes'
      working-directory: /tmp
      run: |
        wget -q https://github.com/ispc/ispc/releases/download/v${ISPC_VERSION}/ispc-v${ISPC_VERSION}-linux.tar.gz
        tar xzf ispc-v${ISPC_VERSION}-linux.tar.gz
        sudo install ispc-v${ISPC_VERSION}-linux/bin/ispc /usr/bin/
    - name: configure
      env:
        SHELL: /bin/sh
      run: ${{ matrix.configure }}
    - name: make
      run: |
        ${{ matrix.make }}
        file dnetc
    - name: Build the OpenCL shim (offers PoCL's CPU device to the unmodified client)
      if: matrix.shim == 'yes'
      run: gcc -shared -fPIC -O1 -o tools/exit-codes/oclshim.so tools/exit-codes/oclshim.c -ldl
    - name: Exit code tests
      run: |
        if [ "${{ matrix.shim }}" = yes ]
        then
          export WRAP="unshare -rn env LD_PRELOAD=$PWD/tools/exit-codes/oclshim.so OCLSHIM_ALLTYPES=1"
        fi
        SLOW=1 PACKET=${{ matrix.packet }} OTHERS=1 TRIM=1 INFO=${{ matrix.info }} \
          sh tools/exit-codes/exitcodes.sh ./dnetc ${{ matrix.label }} ci-out
    - name: Same tests with one test vector changed
      if: matrix.broken == 'yes'
      run: |
        sed -i '28s/0x562D285A/0x562D285B/' common/selftest.cpp
        git diff --stat
        ${{ matrix.make }}
        TRIM=1 INFO=${{ matrix.info }} sh tools/exit-codes/exitcodes.sh ./dnetc ${{ matrix.label }}-broken-vector ci-out
    - name: Results
      if: always()
      run: cat ci-out/*.tsv || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: exit-codes-${{ matrix.label }}
        path: ci-out

  # ------------------------------------------- Linux targets under QEMU user mode
  cross:
    name: ${{ matrix.label }} (QEMU)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-ppc
            triplet: powerpc-linux-gnu
            runner: ubuntu-latest
            ldflags: -static
          - label: linux-ppc64
            triplet: powerpc64-linux-gnu
            runner: ubuntu-latest
            ldflags: -static
          - label: linux-arm-eabi
            triplet: arm-linux-gnueabi
            runner: ubuntu-latest
            ldflags: -static
          - label: linux-s390x
            triplet: s390x-linux-gnu
            runner: ubuntu-latest
            ldflags: -static
          - label: linux-mips64
            triplet: mips64el-linux-gnuabi64
            # apt on ubuntu-latest (26.04) cannot find this cross compiler
            runner: ubuntu-24.04
            ldflags: -mabi=64 -static
    steps:
    - uses: actions/checkout@v4
    - name: Install the cross compiler and QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-${{ matrix.triplet }} file
        # the package was renamed in newer Ubuntu releases
        sudo apt-get install -y qemu-user-static || sudo apt-get install -y qemu-user qemu-user-binfmt
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Offer the cross tools under the names configure and the Makefile use
      run: |
        mkdir -p "$HOME/crossbin"
        for t in gcc g++ strip ar as ld
        do
          ln -s /usr/bin/${{ matrix.triplet }}-$t "$HOME/crossbin/$t"
        done
        echo "$HOME/crossbin" >> "$GITHUB_PATH"
        # lets QEMU run a dynamically linked test program if configure builds one
        echo "QEMU_LD_PREFIX=/usr/${{ matrix.triplet }}" >> "$GITHUB_ENV"
    - name: Work around a compile error in the PowerPC-only battery check
      if: matrix.label == 'linux-ppc'
      run: |
        # common/triggers.cpp:556 compares a FILE pointer with "> 0", which
        # current g++ rejects. Changed in this checkout only, to get a client
        # to test.
        sed -i '556s/fd > 0/fd != 0/' common/triggers.cpp
        sed -n '556p' common/triggers.cpp
    - name: configure
      env:
        SHELL: /bin/sh
      run: |
        gcc -v 2>&1 | tail -1
        ./configure ${{ matrix.label }}
    - name: make
      run: |
        make -j4 LDFLAGS="${{ matrix.ldflags }}"
        file dnetc
    - name: Exit code tests
      run: |
        ./dnetc -cpuinfo | head -20
        SLOW=1 OTHERS=1 TRIM=1 sh tools/exit-codes/exitcodes.sh ./dnetc ${{ matrix.label }}-qemu ci-out
    - name: Results
      if: always()
      run: cat ci-out/*.tsv || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: exit-codes-${{ matrix.label }}-qemu
        path: ci-out

  # ------------------------------------------------------------------ macOS
  macos:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macosx-amd64
            runner: macos-15-intel
            packages: yasm ispc
          - label: macosx-arm64
            runner: macos-15
            packages: ""
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      if: matrix.packages != ''
      run: brew install ${{ matrix.packages }}
    - name: configure
      env:
        SHELL: /bin/sh
      run: ./configure ${{ matrix.label }}
    - name: make
      run: |
        make -j4
        file dnetc
    - name: Exit code tests
      run: SLOW=1 PACKET=1 OTHERS=1 TRIM=1 sh tools/exit-codes/exitcodes.sh ./dnetc ${{ matrix.label }} ci-out
    - name: Results
      if: always()
      run: cat ci-out/*.tsv || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: exit-codes-${{ matrix.label }}
        path: ci-out

  # ---------------------------------------------------------------- Windows
  windows:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: win64-amd64
            arch: AMD64
            vcvars: x64
          - label: win32-x86
            arch: x86
            vcvars: x86
    steps:
    - uses: actions/checkout@v4
    - name: Install YASM and NASM
      shell: pwsh
      run: |
        choco install yasm nasm -y --no-progress
        # makefile.vc on master calls nasmw for one AMD64 file
        Copy-Item "C:\Program Files\NASM\nasm.exe" "C:\Program Files\NASM\nasmw.exe"
        "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Install ISPC
      shell: pwsh
      run: |
        $zip = "$env:RUNNER_TEMP\ispc.zip"
        Invoke-WebRequest -Uri "https://github.com/ispc/ispc/releases/download/v$env:ISPC_VERSION/ispc-v$env:ISPC_VERSION-windows.zip" -OutFile $zip
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
        if ($hash -ne "148d5cd96abe7501c730d5fbd00f1f0c893b96bfeada38d1811c9b6251e86a5c") { throw "ispc.zip sha256 mismatch: $hash" }
        Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
        "$env:RUNNER_TEMP\ispc-v$env:ISPC_VERSION-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Build
      shell: cmd
      run: |
        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%i"
        call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} || exit /b 1
        set "PATH=C:\ProgramData\chocolatey\bin;%PATH%"
        if not exist output mkdir output
        nmake -nologo -f makefile.vc PROCESSOR_ARCHITECTURE=${{ matrix.arch }} > build.log 2>&1
        set RC=%ERRORLEVEL%
        type build.log
        echo nmake exit code %RC%
        if not exist dnetc.exe exit /b 1
        dir dnetc.exe dnetc.com
    - name: Exit code tests
      shell: bash
      run: |
        # the client is started the way a user at the command prompt starts it:
        # through the console wrapper dnetc.com, from cmd.exe, whose view of
        # the exit code is the one recorded
        EXE=.com COMPANION=./dnetc.exe CMDCODE=1 \
          STOP=shutdown SKIPCONFIG=1 SLOW=1 PACKET=1 OTHERS=1 TRIM=1 CAP=120 \
          KILLALL="taskkill //F //IM dnetc.exe //IM dnetc.com" \
          sh tools/exit-codes/exitcodes.sh ./dnetc.com ${{ matrix.label }}-com ci-out
    - name: Results
      if: always()
      shell: bash
      run: cat ci-out/*.tsv || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: exit-codes-${{ matrix.label }}
        path: ci-out

  # ------------------------------------------------------- BSDs in a QEMU VM
  bsd:
    name: ${{ matrix.label }} (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: freebsd-amd64
            os: freebsd
            version: '14.3'
            setup: sudo pkg install -y gmake yasm gcc
          - label: netbsd-amd64
            os: netbsd
            version: '10.1'
            setup: sudo pkgin -y install gmake yasm
          - label: openbsd-amd64
            os: openbsd
            version: '7.7'
            # configure asks "gcc" for its version and builds with eg++
            setup: sudo pkg_add -I gmake yasm gcc%11 g++%11 && sudo ln -sf /usr/local/bin/egcc /usr/local/bin/gcc
    steps:
    - uses: actions/checkout@v4
    - name: Build the ISPC object on the host (there is no ispc for these systems)
      run: |
        cd /tmp
        wget -q https://github.com/ispc/ispc/releases/download/v${ISPC_VERSION}/ispc-v${ISPC_VERSION}-linux.tar.gz
        tar xzf ispc-v${ISPC_VERSION}-linux.tar.gz
        cd "$GITHUB_WORKSPACE"
        /tmp/ispc-v${ISPC_VERSION}-linux/bin/ispc --pic --wno-perf --target=avx512skx-x16 --target-os=freebsd \
          rc5-72/ispc/r72-ks-spmd-ispc.ispc -o ci-ispc-prebuilt.o
        printf '#!/bin/sh\n# stands in for ispc inside the VM: copy the object built on the host\nwhile [ $# -gt 0 ]; do [ "$1" = "-o" ] && out=$2; shift; done\ncp ci-ispc-prebuilt.o "$out"\n' > ci-ispc.sh
        cat ci-ispc.sh
    - name: Start VM
      # cross-platform-actions/action v1.8.0
      uses: cross-platform-actions/action@30cde56b87a128507bebea9531205087890ee360
      with:
        operating_system: ${{ matrix.os }}
        architecture: x86-64
        version: ${{ matrix.version }}
        memory: 4G
        cpu_count: 4
    - name: Build
      shell: cpa.sh {0}
      run: |
        uname -a
        ${{ matrix.setup }}
        SHELL=/bin/sh ./configure ${{ matrix.label }}
        gmake -j4 ISPC="sh ./ci-ispc.sh"
        ls -l dnetc
    - name: Exit code tests
      shell: cpa.sh {0}
      run: |
        SLOW=1 OTHERS=1 TRIM=1 sh tools/exit-codes/exitcodes.sh ./dnetc ${{ matrix.label }} ci-out
        cat ci-out/*.tsv
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: exit-codes-${{ matrix.label }}
        path: ci-out
