name: MIX HYB split sweep (N2)

# Run it by pushing the commit to the hybrid-sweep-run branch:
#   git push origin neon-mix16:hybrid-sweep-run -f
on:
  push:
    branches: [hybrid-sweep-run]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n2:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Sweep
      run: |
        git show 8eab7dfc:rc5-72/arm64/tools/gen_hybrid.py > /tmp/gen_hybrid_old.py  # frame-table constants
        OLDGEN=/tmp/gen_hybrid_old.py SPLITS="26 pre26 29 pre29 26 pre26 29 pre29" \
          sh tools/ci-bench/hybrid-sweep.sh sweep-out 3
    - name: Summary
      if: always()
      run: cat sweep-out/results.md >> "$GITHUB_STEP_SUMMARY" || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hybrid-sweep
        path: |
          sweep-out
          !sweep-out/clockcal
