name: Linux arm64 OpenCL test

on:
  push:
    branches: [ "ci-linux-arm64-opencl" ]
  workflow_dispatch:

jobs:
  build-and-test:
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Machine
      run: |
        uname -a
        lscpu | head -20
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make file ocl-icd-opencl-dev opencl-headers pocl-opencl-icd clinfo
    - name: OpenCL devices
      run: clinfo -l
    - name: configure
      env:
        SHELL: /bin/sh
      run: ./configure linux-arm64-opencl
    - name: make (branch as committed)
      run: make
    - name: binary
      run: |
        file dnetc
        ./dnetc -version
    - name: gpuinfo (branch as committed; CPU device is not listed)
      run: ./dnetc -gpuinfo
    # Test only: the client's own debug switch, so it accepts PoCL's CPU device
    - name: rebuild with the CPU debug switch
      run: |
        sed -i 's|^// #undef  CL_DEVICE_TYPE_GPU|#undef  CL_DEVICE_TYPE_GPU|; s|^// #define CL_DEVICE_TYPE_GPU CL_DEVICE_TYPE_ALL|#define CL_DEVICE_TYPE_GPU CL_DEVICE_TYPE_ALL|' plat/opencl/ocl_setup.cpp
        grep -n "CL_DEVICE_TYPE_GPU CL_DEVICE_TYPE_ALL" plat/opencl/ocl_setup.cpp
        make
    - name: gpuinfo
      run: |
        ./dnetc -gpuinfo 2>&1 | tee gpuinfo.log
        for k in "Platform Version" "Type" "Name" "Max compute units" "OpenCL C version"; do
          v=$(grep -m1 "^ *$k:" gpuinfo.log | sed 's/^ *//')
          echo "::notice title=gpuinfo::$v"
        done
        grep -q "Device Info" gpuinfo.log
    - name: test
      run: |
        ./dnetc -test rc5-72 2>&1 | tr '\r' '\n' | tee test.log
        cores=$(grep -c "using core" test.log)
        passed=$(grep -c "32/32 Tests Passed" test.log)
        echo "::notice title=test::$passed of $cores cores passed 32/32"
        grep -o "using core.*" test.log | while read -r l; do echo "::notice title=test core::$l"; done
        if grep -qi "failed" test.log; then echo "::error title=failure::a test failed"; exit 1; fi
        [ "$cores" -gt 0 ] && [ "$passed" -eq "$cores" ]
    - name: stress
      run: |
        ./dnetc -stress rc5-72 2>&1 | tr '\r' '\n' | tee stress.log
        cores=$(grep -c "using core" stress.log)
        last=$(grep -c "Stress-test 4 passed" stress.log)
        total=$(grep -c "Stress-test [0-9]* passed" stress.log)
        echo "::notice title=stress::$cores cores, $total stress tests passed, $last cores passed stress-test 4"
        if grep -qi "failed" stress.log; then echo "::error title=failure::a test failed"; exit 1; fi
        [ "$cores" -gt 0 ] && [ "$last" -eq "$cores" ]
    - name: bench
      run: |
        ./dnetc -bench rc5-72 2>&1 | tr '\r' '\n' | tee bench.log
        grep -E "keys/sec" bench.log | sed 's/^ *//' | head -8 | while read -r l; do echo "::notice title=bench::$l"; done

  # Test build for a Raspberry Pi: built in a Debian 11 container so the
  # binaries also run on systems with an older C library than the runner's.
  # Builds the OpenCL client and, for comparison, the CPU client.
  pi-build:
    name: build in Debian 11 (arm64) for older systems
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye

    steps:
    - name: Install build tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends g++ make file binutils ocl-icd-opencl-dev opencl-headers ca-certificates git
        g++ --version | head -1
        ldd --version | head -1
    - uses: actions/checkout@v4
    - name: CPU client (linux-arm64)
      env:
        SHELL: /bin/sh
      run: |
        cp -r . ../cpu
        cd ../cpu
        ./configure linux-arm64 > cfg.log 2>&1 || { tail -20 cfg.log; exit 1; }
        make -j4 > build.log 2>&1 || [ -x dnetc ] || { grep -iE -m20 error build.log; exit 1; }
        file dnetc
        ./dnetc -test rc5-72 < /dev/null 2>&1 | tr '\r' '\n' | grep -E "using core|Tests Passed"
    - name: OpenCL client (linux-arm64-opencl)
      env:
        SHELL: /bin/sh
      run: |
        ./configure linux-arm64-opencl
        make
        file dnetc
        ./dnetc -gpuinfo || true
    - name: Package
      run: |
        mkdir -p kit
        cp dnetc kit/dnetc-opencl
        cp ../cpu/dnetc kit/dnetc-cpu
        for f in kit/dnetc-opencl kit/dnetc-cpu
        do
          echo "$f: newest glibc symbol needed: $(objdump -T $f | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
          ldd $f
        done | tee kit/build-info.txt
        sha256sum kit/dnetc-opencl kit/dnetc-cpu | tee -a kit/build-info.txt
    - uses: actions/upload-artifact@v4
      with:
        name: pi-kit
        path: kit/
