name: Windows amd64 Vulkan CI

on:
  push:
    branches: [ "ci-vulkan-client" ]

jobs:
  build:
    timeout-minutes: 30

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Vulkan headers and loader
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        git clone --depth 1 --branch vulkan-sdk-1.4.363.0 https://github.com/KhronosGroup/Vulkan-Headers
        git clone --depth 1 --branch vulkan-sdk-1.4.363.0 https://github.com/KhronosGroup/Vulkan-Loader
        cmake -S Vulkan-Headers -B headers -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD")/headers-install"
        cmake --install headers
        cmake -S Vulkan-Loader -B loader -A x64 -DVULKAN_HEADERS_INSTALL_DIR="$(cygpath -m "$PWD")/headers-install"
        cmake --build loader --config Release
        mkdir -p vk/Include vk/Lib
        cp -r headers-install/include/vulkan headers-install/include/vk_video vk/Include/
        cp loader/loader/Release/vulkan-1.lib vk/Lib/
        cp loader/loader/Release/vulkan-1.dll "$GITHUB_WORKSPACE"
    # The runner has no GPU or Vulkan driver, so the client is built to also
    # accept CPU devices (test builds only) and run on Mesa's llvmpipe.
    - name: nmake
      shell: cmd
      run: |
        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%i"
        call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" amd64
        set CL=-DVK_ALLOW_CPU_DEVICES
        nmake -nologo -f makefile.vc PROCESSOR_ARCHITECTURE=VULKAN64 VULKANDIR=%RUNNER_TEMP%\vk\
    - name: Install Mesa
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-mesa
    - name: Register llvmpipe
      shell: cmd
      run: |
        reg add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v "${{ steps.msys2.outputs.msys2-location }}\mingw64\share\vulkan\icd.d\lvp_icd.x86_64.json" /t REG_DWORD /d 0 /f
        echo ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin>> %GITHUB_PATH%
    - name: gpuinfo
      shell: bash
      run: ./dnetc.exe -gpuinfo
    - name: test
      shell: bash
      run: ./dnetc.exe -test
