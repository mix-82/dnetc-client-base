name: macOS quick test (MIX cores)

# Lean macOS-only job: build, -test rc5-72, bench cores 6/7/8 once.
# Trigger: push to the macos-run branch, or dispatch. Kept separate from
# arm64-bench.yml so a starved macOS pool never blocks the N2 results and
# this can be retried alone until a runner is acquired.
on:
  push:
    branches: [macos-run]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        ./configure macosx-arm64
        make -j3
    - name: Self-test
      run: ./dnetc -test rc5-72
    - name: Bench (MIX NEON #7 vs MIX HYBRID #8, alternating)
      run: |
        cc -O2 tools/ci-bench/clockcal.c -o clockcal
        rate() { sed -E 's/^\[[^]]*\] //' "$1" | grep -oE '\[[0-9,]+ keys/sec\]' | tail -1 | tr -d '[],'; }
        {
          echo "## ${{ matrix.os }}: $(sysctl -n machdep.cpu.brand_string) x $(sysctl -n hw.ncpu)"
          echo "| round | core | keys/sec | GHz before/after |"
          echo "|---|---|---|---|"
          for r in 1 2 3 4; do
            for core in 7 8; do
              g1=$(./clockcal 5 | awk '{print $1}')
              ./dnetc -bench rc5-72 $core > bench-$core-$r.log 2>&1 || true
              g2=$(./clockcal 5 | awk '{print $1}')
              name=$(grep -oE 'core #[0-9]+ \([^)]*\)' bench-$core-$r.log | head -1)
              echo "| $r | $name | $(rate bench-$core-$r.log) | $g1 / $g2 |"
            done
          done
        } | tee results-${{ matrix.os }}.md
        cat results-${{ matrix.os }}.md >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: macos-quick-${{ matrix.os }}
        path: |
          results-*.md
          bench-*.log
