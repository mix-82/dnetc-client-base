name: Linux arm64 CI

on:
  push:
    branches: [ "ci-opencl-cpu-devices" ]

jobs:
  build:
    timeout-minutes: 20

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: configure
      env:
        SHELL: /bin/sh
      run: ./configure linux-arm64
    - name: make
      run: make
    - name: test
      run: ./dnetc -test
    - name: cpuinfo
      run: ./dnetc -cpuinfo
